[project]
name = "radarr-mcp"
version = "0.2.0"
description = "MCP server for Radarr's v3 API"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["fastmcp>=4.1.4"]

[project.scripts]
radarr-mcp = "radarr_mcp:main"

[dependency-groups]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.4.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: hits a real Radarr instance (needs RADARR_URL/RADARR_API_KEY)"]
addopts = "-m 'not integration'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
